<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>System Dokumentacji — Formularz sterowany (Mock)</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; }
      label { display: block; margin-top: 1rem; font-weight: 600; }
      input, textarea { width: 100%; padding: 0.5rem; margin-top: 0.25rem; }
      button { margin-top: 1.5rem; padding: 0.5rem 1.5rem; }
      #state-debug { font-family: monospace; background: #eee; padding: 1rem; margin-top: 1rem; }
      #submit-marker { color: #b00; font-weight: 700; margin-top: 1rem; display: none; }
    </style>
  </head>
  <body>
    <h1>Rejestracja badania — formularz JS-controlled</h1>
    <!--
      Mock Target Page variant emulating a framework-controlled form:
      state is only ever updated from 'input' events and every 'change'
      event re-renders the DOM from state, so naive `el.value = x` writes
      get reverted. Framework-safe filling must survive here.
    -->
    <form id="controlled-form" action="/save" method="post">
      <label>Badany narząd <input id="field-organ" name="organ" /></label>
      <label>Imię i Nazwisko <input id="field-name" name="patient_name" /></label>
      <label>Wiek <input id="field-age" name="age" type="number" /></label>
      <label>PESEL <input id="field-pesel" name="pesel" maxlength="11" /></label>
      <label>Opis badania <textarea id="field-description" name="description" rows="6"></textarea></label>
      <button type="submit" id="zapisz-button">Zapisz</button>
    </form>
    <pre id="state-debug"></pre>
    <p id="submit-marker">FORM-WAS-SUBMITTED</p>

    <script>
      const state = { organ: "", patient_name: "", age: "", pesel: "", description: "" };
      const debug = document.getElementById("state-debug");

      function render() {
        for (const [name, value] of Object.entries(state)) {
          const el = document.querySelector(`[name="${name}"]`);
          if (el && el.value !== value) el.value = value;
        }
        debug.textContent = JSON.stringify(state);
      }

      document.getElementById("controlled-form").addEventListener("input", (event) => {
        const target = event.target;
        if (target.name in state) state[target.name] = target.value;
      });

      document.getElementById("controlled-form").addEventListener("change", () => {
        render();
      });

      document.getElementById("controlled-form").addEventListener("submit", (event) => {
        event.preventDefault();
        document.getElementById("submit-marker").style.display = "block";
      });

      render();
    </script>
  </body>
</html>
